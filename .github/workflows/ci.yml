name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install platform dependencies
        working-directory: platform
        run: npm ci

      # The manifest is generated from content/modules/*.yml and committed, so
      # the app can import it directly. Fail if someone edited the YAML without
      # regenerating, or edited the generated file by hand.
      - name: Check manifest is up to date
        run: node scripts/build-manifest.mjs --check

      # The content validator is the guard rail across the three sources of truth
      # (markdown chapters, module files, locale files). See ANALYSIS.md §9.1.
      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Lint
        working-directory: platform
        run: npm run lint

      - name: Typecheck
        working-directory: platform
        run: npx tsc -b --force

      - name: Build
        working-directory: platform
        run: npm run build

      - name: Report bundle size
        working-directory: platform
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "chunks: $(find dist/assets -name '*.js' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "assets: $(du -sh dist/assets | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "entry:  $(du -h dist/assets/index-*.js | sort -h | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
